<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>心率 + 体温</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 28px;
    background: #0d1117; color: #e6edf3;
    font: 14px/1.5 ui-monospace, "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;
  }
  h1 { font-size: 13px; font-weight: 600; color: #8b949e;
       margin: 0 0 20px; letter-spacing: .12em; }
  .row { display: flex; gap: 32px; align-items: flex-end;
         flex-wrap: wrap; margin-bottom: 22px; }
  .stat { font-size: 12.5px; color: #8b949e; letter-spacing: .05em; }
  .stat b { display: block; font-size: 20px; color: #e6edf3; font-weight: 600;
            font-variant-numeric: tabular-nums; margin-top: 4px; }
  .big  { font-size: 72px; font-weight: 700; line-height: 1;
          font-variant-numeric: tabular-nums; }
  .big.idle { color: #30363d; }
  .hr   { color: #3fb950; }
  .tp   { color: #58a6ff; }
  .unit { font-size: 14px; color: #8b949e; margin-left: 7px; }
  .panel { margin-bottom: 18px; }
  .panel .cap { font-size: 12px; color: #6e7681; margin-bottom: 6px;
                letter-spacing: .06em; }
  canvas { width: 100%; background: #010409; display: block;
           border: 1px solid #21262d; border-radius: 10px; }
  #cv { height: 220px; }
  #tc { height: 120px; }
  .pill { display: inline-block; padding: 3px 12px; border-radius: 999px;
          font-size: 12px; font-weight: 600; }
  .on  { background: #1a7f37; color: #fff; }
  .off { background: #30363d; color: #8b949e; }
  .hint { color: #6e7681; margin-top: 16px; font-size: 12.5px; }
</style>
</head>
<body>
<h1>MAX30102 心率 + AS6221 体温</h1>

<div class="row">
  <div>
    <div class="stat">心率</div>
    <div><span id="bpm" class="big hr idle">--</span><span class="unit">BPM</span></div>
  </div>
  <div>
    <div class="stat">体温</div>
    <div><span id="temp" class="big tp idle">--</span><span class="unit">℃</span></div>
  </div>
  <div class="stat">手指<b id="finger"><span class="pill off">没按</span></b></div>
  <div class="stat">RED<b id="red">--</b></div>
  <div class="stat">IR<b id="ir">--</b></div>
  <div class="stat">交流幅度<b id="amp">--</b></div>
  <div class="stat">样本<b id="count">0</b></div>
</div>

<div class="panel">
  <div class="cap">脉搏波形 (红外交流分量, 已滤掉基线漂移) · 橙线 = 检测到的心跳</div>
  <canvas id="cv"></canvas>
</div>

<div class="panel">
  <div class="cap">体温趋势 <span id="trange"></span></div>
  <canvas id="tc"></canvas>
</div>

<div class="hint" id="hint">正在连接 ...</div>

<script>
const cv  = document.getElementById('cv'),  ctx  = cv.getContext('2d');
const tc  = document.getElementById('tc'),  tctx = tc.getContext('2d');
const el  = id => document.getElementById(id);

function fit(c, g) {
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  c.width  = Math.round(r.width  * d);
  c.height = Math.round(r.height * d);
  g.setTransform(d, 0, 0, d, 0, 0);
}
function fitAll() { fit(cv, ctx); fit(tc, tctx); }
addEventListener('resize', fitAll);
fitAll();

function drawPulse(ac, beats) {
  const r = cv.getBoundingClientRect(), W = r.width, H = r.height;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
  if (ac.length < 2) return;

  // 自适应纵轴: 用 95 分位而不是最大值, 免得一个毛刺把整条波形压平
  const s = ac.map(Math.abs).sort((a, b) => a - b);
  const scale = Math.max(s[Math.floor(s.length * 0.95)] || 1, 1) * 1.3;
  const px = i => i / (ac.length - 1) * W;
  const py = v => H / 2 - v / scale * (H / 2 - 10);

  ctx.strokeStyle = '#f0883e44'; ctx.lineWidth = 1;
  beats.forEach((b, i) => {
    if (!b) return;
    ctx.beginPath(); ctx.moveTo(px(i), 0); ctx.lineTo(px(i), H); ctx.stroke();
  });

  ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 1.7;
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.beginPath();
  ac.forEach((v, i) => i ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)));
  ctx.stroke();

  ctx.fillStyle = '#f0883e';
  beats.forEach((b, i) => {
    if (!b) return;
    ctx.beginPath(); ctx.arc(px(i), py(ac[i]), 3.5, 0, 7); ctx.fill();
  });
}

function drawTemp(raw) {
  const r = tc.getBoundingClientRect(), W = r.width, H = r.height;
  tctx.clearRect(0, 0, W, H);

  // 温度每 250ms 才更新一次, 同一段里会有重复值; 空值用前一个值顶上
  let last = null;
  const v = raw.map(x => (x !== null ? (last = x) : last));
  const vals = v.filter(x => x !== null);
  if (vals.length < 2) return;

  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, 0.08);
  const y0 = lo - pad, y1 = hi + pad;

  const px = i => i / (v.length - 1) * W;
  const py = t => H - 2 - (t - y0) / (y1 - y0) * (H - 4);

  // 上下两条参考线
  tctx.strokeStyle = '#21262d'; tctx.lineWidth = 1;
  tctx.setLineDash([3, 4]);
  [hi, lo].forEach(t => {
    tctx.beginPath(); tctx.moveTo(0, py(t)); tctx.lineTo(W, py(t)); tctx.stroke();
  });
  tctx.setLineDash([]);

  tctx.strokeStyle = '#58a6ff'; tctx.lineWidth = 1.8;
  tctx.lineJoin = tctx.lineCap = 'round';
  tctx.beginPath();
  let started = false;
  v.forEach((t, i) => {
    if (t === null) return;
    started ? tctx.lineTo(px(i), py(t)) : (tctx.moveTo(px(i), py(t)), started = true);
  });
  tctx.stroke();

  // 右端当前值
  const cur = vals[vals.length - 1];
  tctx.fillStyle = '#58a6ff';
  tctx.beginPath(); tctx.arc(W - 1, py(cur), 3.5, 0, 7); tctx.fill();

  el('trange').textContent =
    `窗口 ${lo.toFixed(2)} ~ ${hi.toFixed(2)} ℃  (跨度 ${(hi - lo).toFixed(2)} ℃)`;
}

async function tick() {
  try {
    const d = await (await fetch('/data')).json();

    el('bpm').textContent  = d.bpm > 0 ? d.bpm : '--';
    el('bpm').className    = 'big hr' + (d.bpm > 0 ? '' : ' idle');
    el('temp').textContent = d.temp !== null ? d.temp.toFixed(2) : '--';
    el('temp').className   = 'big tp' + (d.temp !== null ? '' : ' idle');
    el('finger').innerHTML = d.finger
      ? '<span class="pill on">已按上</span>'
      : '<span class="pill off">没按</span>';
    el('red').textContent   = d.red || '--';
    el('ir').textContent    = d.ir  || '--';
    el('count').textContent = d.count;

    const s = d.ac.map(Math.abs).sort((a, b) => a - b);
    const amp = s.length ? s[Math.floor(s.length * 0.9)] : 0;
    el('amp').textContent = amp ? Math.round(amp) : '--';

    drawPulse(d.ac, d.beats);
    drawTemp(d.tempSeries);

    el('hint').textContent = d.error ? d.error
      : d.done ? '这一轮结束, 正在自动开始下一轮 ...'
      : '心率来自 MAX30102 (GPIO8/9), 温度来自 AS6221 (GPIO10/11), 两条独立 I2C 总线 · 每 0.15 秒刷新';
  } catch (e) {
    // 别把所有异常都报成"断连": 真正断连和页面自己抛错要能分清,
    // 否则下次再出一个 TypeError 又是同样一副"服务没了"的样子。
    const m = String((e && e.message) || e);
    el('hint').textContent = /fetch|network|load failed/i.test(m)
      ? '连不上本地服务, 确认 pulse.py 还在跑'
      : `页面出错: ${m}    (按 F12 看控制台)`;
  }
}

setInterval(tick, 150);
tick();
</script>
</body>
</html>
