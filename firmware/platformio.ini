; ESP32-S3 AI 手表
; 板子: ESP32-S3-DevKitC-1 (N16R8 = 16MB Flash QIO + 8MB PSRAM OPI)

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; ---- 平台自带的板子定义是 N8 / 无 PSRAM, 这三行必须覆盖 ----
; 注意: 镜像头的 flash 大小只认 board_upload.flash_size,
;       写 board_build.flash_size 平台会忽略 (builder/main.py 只读 upload.flash_size)
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

; 固件里 Serial 跑 921600, 这样 1.92MB 的 PCM 上传约 21 秒 (115200 要近 3 分钟)
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
upload_speed = 921600
upload_port = COM10
monitor_port = COM10
